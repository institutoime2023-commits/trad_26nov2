
name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download open-source Demucs engine
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p "$GITHUB_WORKSPACE/third_party"
        git clone --depth 1 --recurse-submodules \
          https://github.com/jPaauwe/demucs-android \
          "$GITHUB_WORKSPACE/third_party/demucs-android"
        test -f "$GITHUB_WORKSPACE/third_party/demucs-android/CMakeLists.txt"
        echo "Demucs engine downloaded successfully"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Install Android NDK and CMake
      run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

    - name: Verify Demucs engine location
      run: |
        pwd
        ls -la "$GITHUB_WORKSPACE/third_party/demucs-android"
        test -f "$GITHUB_WORKSPACE/third_party/demucs-android/CMakeLists.txt"

    - name: Build with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
